		<script>
			// Helper pemformatan tanggal ke Bahasa Indonesia untuk UI
			function formatTanggalIndo(dateStr) {
				if (!dateStr) return '';
				const date = new Date(dateStr);
				if (isNaN(date.getTime())) return dateStr;
				return date.toLocaleDateString('id-ID', {
					day: 'numeric',
					month: 'long',
					year: 'numeric'
				});
			}

			function initSingleArticlePage() {
				const titleEl = document.getElementById('article-title');
				const breadcrumbTitleEl = document.getElementById('breadcrumb-title');
				const dateEl = document.getElementById('article-date');
				const contentEl = document.getElementById('article-content');
				const coverContainer = document.getElementById('cover-container');
				const coverImg = document.getElementById('article-cover');
				const tagsContainer = document.getElementById('tags-container');

				if (!contentEl) return;

				const urlParams = new URLSearchParams(window.location.search);
				const currentSlug = urlParams.get('slug');

				if (!currentSlug) return;

				fetch('assets/js/articles.json')
					.then(res => res.json())
					.then(data => {
						const article = data.find(item => item.slug === currentSlug);

						if (article) {
							const fullTitle = `${article.title} - Catatan Al Ikhsan Nahdillah Muis Malik`;
							const currentUrl = window.location.href;
							const encodedUrl = encodeURIComponent(currentUrl);
							const encodedTitle = encodeURIComponent(article.title);

							const coverPath = article.cover || article.ikon || 'assets/img/og-image.jpg';
							const fullImgUrl = coverPath.startsWith('http') ? coverPath : (window.location.origin + '/' + coverPath);
							
							const rawDate = article.date || article.tanggal || '';
							const formattedDateUI = formatTanggalIndo(rawDate);
							
							// Pembuatan deskripsi otomatis jika excerpt tidak diisi
							let excerptText = article.excerpt || article.description || '';
							if (!excerptText && article.content) {
								const tempDiv = document.createElement('div');
								tempDiv.innerHTML = article.content;
								excerptText = (tempDiv.textContent || tempDiv.innerText || '').substring(0, 160).trim() + '...';
							}

							// 1. Update Konten Tampilan Halaman
							document.title = fullTitle;
							if (titleEl) titleEl.innerText = article.title;
							if (breadcrumbTitleEl) breadcrumbTitleEl.innerText = article.title;
							if (dateEl) dateEl.innerText = formattedDateUI;
							if (contentEl) contentEl.innerHTML = article.content;

							// 2. Setup URL Tautan Share Social Media (Atas)
							const waUrl = `https://api.whatsapp.com/send?text=${encodedTitle}%20${encodedUrl}`;
							const twitterUrl = `https://twitter.com/intent/tweet?text=${encodedTitle}&url=${encodedUrl}`;
							const fbUrl = `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`;
							const linkedinUrl = `https://www.linkedin.com/sharing/share-offsite/?url=${encodedUrl}`;

							// Assign link ke tombol share atas
							const setShareHref = (id, href) => {
								const el = document.getElementById(id);
								if (el) el.href = href;
							};

							setShareHref('share-top-wa', waUrl);
							setShareHref('share-top-twitter', twitterUrl);
							setShareHref('share-top-fb', fbUrl);
							setShareHref('share-top-linkedin', linkedinUrl);

							// Handler Copy Link (Salin Tautan)
							const copyHandler = () => {
								navigator.clipboard.writeText(currentUrl).then(() => {
									const tooltip = document.getElementById('copy-tooltip-top');
									if (tooltip) {
										tooltip.classList.remove('opacity-0');
										setTimeout(() => { tooltip.classList.add('opacity-0'); }, 2000);
									}
								}).catch(err => {
									console.error('Gagal menyalin tautan:', err);
								});
							};

							// Handler Share Instagram
							const instagramHandler = () => {
								if (navigator.share) {
									navigator.share({
										title: article.title,
										text: excerptText,
										url: currentUrl,
									}).catch((err) => console.log('Batal berbagi:', err));
								} else {
									navigator.clipboard.writeText(currentUrl).then(() => {
										alert('Tautan artikel berhasil disalin! Silakan bagikan ke Instagram Story atau Chat Anda.');
									});
								}
							};

							// Event listener Tombol Share Atas
							const topCopyBtn = document.getElementById('share-top-copy');
							if (topCopyBtn) topCopyBtn.onclick = () => copyHandler();

							const topIgBtn = document.getElementById('share-top-ig');
							if (topIgBtn) topIgBtn.onclick = instagramHandler;

							// 3. Render Cover Image
							if (coverPath && coverImg && coverContainer) {
								coverImg.src = coverPath;
								coverImg.alt = article.title;
								coverContainer.classList.remove('hidden');
							} else if (coverContainer) {
								coverContainer.classList.add('hidden');
							}

							// 4. Render Tags
							const tagsList = article.tags || (article.kategori ? [article.kategori] : (article.category ? [article.category] : []));
							if (tagsList && tagsList.length > 0 && tagsContainer) {
								tagsContainer.innerHTML = '';
								tagsList.forEach(tag => {
									const tagAnchor = document.createElement('a');
									tagAnchor.href = `tags.html?tag=${encodeURIComponent(tag)}`;
									tagAnchor.className = 'inline-block bg-gray-100 hover:bg-gray-200 text-gray-600 hover:text-gray-900 text-xs font-medium px-3 py-1 rounded-md transition';
									tagAnchor.innerText = tag;
									tagsContainer.appendChild(tagAnchor);
								});
								tagsContainer.classList.remove('hidden');
							}

							// 5. Helper Function untuk Update Meta Tag secara Presisi
							const setMetaTag = (selector, attrName, attrValue, contentValue) => {
								let el = document.querySelector(selector);
								if (!el) {
									el = document.createElement('meta');
									el.setAttribute(attrName, attrValue);
									document.head.appendChild(el);
								}
								el.setAttribute('content', contentValue);
							};

							// --- UPDATE META SEO UTAMA ---
							setMetaTag('meta[name="title"]', 'name', 'title', fullTitle);
							setMetaTag('meta[name="description"]', 'name', 'description', excerptText);
							if (tagsList.length > 0) {
								setMetaTag('meta[name="keywords"]', 'name', 'keywords', tagsList.join(', '));
							}

							// --- UPDATE OPEN GRAPH (FB / WA) ---
							setMetaTag('meta[property="og:title"]', 'property', 'og:title', fullTitle);
							setMetaTag('meta[property="og:description"]', 'property', 'og:description', excerptText);
							setMetaTag('meta[property="og:url"]', 'property', 'og:url', currentUrl);
							setMetaTag('meta[property="og:image"]', 'property', 'og:image', fullImgUrl);
							setMetaTag('meta[property="article:published_time"]', 'property', 'article:published_time', rawDate);

							// --- UPDATE TWITTER CARD ---
							setMetaTag('meta[property="twitter:title"]', 'property', 'twitter:title', fullTitle);
							setMetaTag('meta[property="twitter:description"]', 'property', 'twitter:description', excerptText);
							setMetaTag('meta[property="twitter:url"]', 'property', 'twitter:url', currentUrl);
							setMetaTag('meta[property="twitter:image"]', 'property', 'twitter:image', fullImgUrl);

							// --- UPDATE CANONICAL URL ---
							let canonicalEl = document.querySelector('link[rel="canonical"]');
							if (!canonicalEl) {
								canonicalEl = document.createElement('link');
								canonicalEl.setAttribute('rel', 'canonical');
								document.head.appendChild(canonicalEl);
							}
							canonicalEl.setAttribute('href', currentUrl);

							// --- UPDATE SCHEMA.ORG JSON-LD ---
							let schemaEl = document.getElementById('schema-json');
							if (schemaEl) {
								const schemaData = {
									"@context": "https://schema.org",
									"@type": "BlogPosting",
									"mainEntityOfPage": {
										"@type": "WebPage",
										"@id": currentUrl
									},
									"headline": article.title,
									"description": excerptText,
									"image": fullImgUrl,  
									"author": {
										"@type": "Person",
										"name": "Al Ikhsan Nahdillah Muis Malik",
										"url": "https://ikhsannahdillah.github.io/tentang.html"
									},
									"publisher": {
										"@type": "Person",
										"name": "Al Ikhsan Nahdillah Muis Malik"
									},
									"datePublished": rawDate,
									"dateModified": rawDate
								};
								schemaEl.textContent = JSON.stringify(schemaData, null, 2);
							}
						}
					})
					.catch(err => console.error('Gagal memuat meta artikel:', err));
			}

			// Eksekusi fungsi langsung saat dimuat
			initSingleArticlePage();

			// Hook untuk Swup
			if (window.swupInstance) {
				window.swupInstance.hooks.on('page:view', initSingleArticlePage);
				window.swupInstance.hooks.on('content:replace', initSingleArticlePage);
			}
		</script>
	</main>

	<!-- FOOTER KOSONG DENGAN ID -->
	<footer id="site-footer" class="max-w-2xl w-full mx-auto px-6 pt-12 pb-10 mt-16 border-t border-gray-100 flex flex-col sm:flex-row justify-between items-center gap-4 text-xs text-gray-500"></footer>

	<!-- SKRIP INISIALISASI SWUP & COMPONENT LOADER -->
	<script>
		if (typeof window.swupInstance === 'undefined') {
			window.swupInstance = new Swup({
				plugins: [
					new SwupScriptsPlugin(),
					new SwupHeadPlugin({
						awaitAssets: true,
						persistAssets: true
					})
				],
				resolveUrl: (url) => url
			});
		}

		function loadComponents() {
			const headerEl = document.getElementById('site-header');
			if (headerEl && !headerEl.innerHTML.trim()) {
				fetch('components/header.html')
					.then(res => res.text())
					.then(html => headerEl.innerHTML = html)
					.catch(err => console.error(err));
			}

			const footerEl = document.getElementById('site-footer');
			if (footerEl && !footerEl.innerHTML.trim()) {
				fetch('components/footer.html')
					.then(res => res.text())
					.then(html => footerEl.innerHTML = html)
					.catch(err => console.error(err));
			}
		}

		loadComponents();

		if (window.swupInstance) {
			window.swupInstance.hooks.on('page:view', loadComponents);
		}
	</script>
</body>
</html>
