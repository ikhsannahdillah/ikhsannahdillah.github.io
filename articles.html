<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary Meta Tags -->
    <title>Arsip Tulisan - Catatan Al Ikhsan Nahdillah Muis Malik</title>
    <meta name="description" content="Kumpulan seluruh tulisan, artikel, opini, dan dokumentasi belajar Al Ikhsan Nahdillah Muis Malik seputar teknologi dan catatan pribadi.">
    <meta name="author" content="Al Ikhsan Nahdillah Muis Malik">
    <meta name="robots" content="index, follow">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://ikhsannahdillah.github.io/articles.html">

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ikhsannahdillah.github.io/articles.html">
    <meta property="og:title" content="Arsip Tulisan - Catatan Al Ikhsan Nahdillah Muis Malik">
    <meta property="og:description" content="Kumpulan seluruh tulisan, artikel, opini, dan dokumentasi belajar Al Ikhsan Nahdillah Muis Malik seputar teknologi dan catatan pribadi.">
    <meta property="og:image" content="https://ikhsannahdillah.github.io/assets/img/og-image.jpg">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://ikhsannahdillah.github.io/articles.html">
    <meta name="twitter:title" content="Arsip Tulisan - Catatan Al Ikhsan Nahdillah Muis Malik">
    <meta name="twitter:description" content="Kumpulan seluruh tulisan, artikel, opini, dan dokumentasi belajar Al Ikhsan Nahdillah Muis Malik seputar teknologi dan catatan pribadi.">
    <meta name="twitter:image" content="https://ikhsannahdillah.github.io/assets/img/og-image.jpg">

    <!-- CSS & Typography -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .transition-fade {
            transition: opacity 0.2s ease-in-out, transform 0.2s ease-in-out;
            opacity: 1;
            transform: translateY(0);
        }
        html.is-animating .transition-fade {
            opacity: 0;
            transform: translateY(4px);
        }
    </style>

    <!-- CDN Swup & Plugin Scripts -->
    <script src="https://unpkg.com/swup@4"></script>
    <script src="https://unpkg.com/@swup/scripts-plugin@2"></script>
    <script src="https://unpkg.com/@swup/head-plugin@2"></script>
    
    <link rel="icon" type="image/jpg" href="assets/img/favicon.jpg">
</head>
<body class="bg-white text-gray-800 antialiased min-h-screen flex flex-col justify-between">

    <!-- HEADER KOSONG DENGAN ID -->
    <header id="site-header" class="max-w-2xl w-full mx-auto px-6 pt-10 pb-8 flex justify-between items-center"></header>

    <!-- KONTAINER UTAMA ARSIP (DI DALAM #SWUP) -->
    <main id="swup" class="transition-fade max-w-2xl w-full mx-auto px-6 py-4 flex-grow">
        <section>
            <!-- Judul Halaman -->
            <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-900 tracking-tight mb-6">
                Tulisan Al Ikhsan Nahdillah Muis Malik
            </h1>

            <!-- Bar Pencarian & Counter Jumlah Artikel -->
            <div class="flex items-center gap-4 mb-8">
                <div class="relative flex-grow">
                    <input 
                        type="text" 
                        id="search-input" 
                        placeholder="Cari tulisan..." 
                        class="w-full px-4 py-2.5 text-sm sm:text-base text-gray-800 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition shadow-sm"
                    >
                </div>
                <span id="total-count" class="text-lg sm:text-xl font-medium text-blue-600 min-w-[2rem] text-right">0</span>
            </div>

            <!-- Daftar Artikel -->
            <div id="daftar-arsip" class="divide-y divide-gray-100 border-t border-b border-gray-100">
                <p class="py-6 text-sm text-gray-400">Memuat tulisan...</p>
            </div>
        </section>

        <!-- SKRIP LOGIKA PENCARIAN & ARSIP -->
        <script>
            // Helper pemformatan tanggal ke Bahasa Indonesia untuk UI
            function formatTanggalIndo(dateStr) {
                if (!dateStr) return '';
                const date = new Date(dateStr);
                if (isNaN(date.getTime())) return dateStr;
                return date.toLocaleDateString('id-ID', {
                    day: 'numeric',
                    month: 'long',
                    year: 'numeric'
                });
            }

            function initArsip() {
                const container = document.getElementById('daftar-arsip');
                const searchInput = document.getElementById('search-input');
                const countEl = document.getElementById('total-count');

                if (!container) return;

                let sourceArticles = [];

                // Fungsi untuk merender daftar artikel ke DOM
                function renderList(articles) {
                    if (countEl) countEl.innerText = articles.length;

                    if (articles.length === 0) {
                        container.innerHTML = '<p class="py-6 text-sm text-gray-500">Tidak ada artikel yang ditemukan.</p>';
                        return;
                    }

                    container.innerHTML = articles.map(item => {
                        let rawLink = item.slug || item.url || '#';
                        
                        // Pembersihan dan penyesuaian format URL
                        if (rawLink !== '#') {
                            if (!rawLink.includes('.html')) {
                                rawLink = `articles/${rawLink}.html`;
                            }
                            if (rawLink.startsWith('/')) {
                                rawLink = rawLink.substring(1);
                            }
                        }

                        let imageSrc = item.cover || item.ikon || 'assets/img/og-image.jpg';
                        if (imageSrc.startsWith('/')) {
                            imageSrc = imageSrc.substring(1);
                        }

                        const title = item.title || item.judul;

                        return `
                            <a href="${rawLink}" class="group relative flex items-center gap-4 py-4 px-3 rounded-xl transition-all duration-300 ease-out hover:bg-gray-50 hover:shadow-sm hover:-translate-y-0.5">
                                <div class="w-16 h-12 sm:w-20 sm:h-14 flex-shrink-0 rounded-lg overflow-hidden bg-gray-100 border border-gray-200/80 shadow-xs relative">
                                    <img src="${imageSrc}" alt="Cover" class="w-full h-full object-cover group-hover:scale-110 transition duration-500 ease-out">
                                    <div class="absolute inset-0 bg-blue-600/0 group-hover:bg-blue-600/10 transition duration-300"></div>
                                </div>
                                <div class="flex-grow min-w-0">
                                    <h2 class="text-base sm:text-lg font-bold text-gray-900 group-hover:text-blue-600 transition-colors duration-200 leading-snug flex items-center justify-between">
                                        <span class="truncate">${title}</span>
                                        <svg class="w-4 h-4 ml-2 text-blue-600 opacity-0 -translate-x-2 group-hover:opacity-100 group-hover:translate-x-0 transition-all duration-300 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                                        </svg>
                                    </h2>
                                    <p class="text-xs text-gray-400 font-normal mt-1">
                                        ${formatTanggalIndo(item.date || item.tanggal)}
                                    </p>
                                </div>
                            </a>
                        `;
                    }).join('');
                }

                // Ambil Data Artikel dari JSON
                fetch('assets/js/articles.json')
                    .then(res => {
                        if (!res.ok) return fetch('assets/js/artikel.json');
                        return res;
                    })
                    .then(res => {
                        if (!res.ok) throw new Error('File JSON tidak ditemukan');
                        return res.json();
                    })
                    .then(data => {
                        sourceArticles = data;

                        // Urutkan tanggal terbaru ke terlama
                        sourceArticles.sort((a, b) => new Date(b.date || b.tanggal) - new Date(a.date || a.tanggal));

                        // Render seluruh artikel
                        renderList(sourceArticles);

                        // Pasang Fitur Live Search
                        if (searchInput) {
                            searchInput.value = '';
                            searchInput.addEventListener('input', (e) => {
                                const keyword = e.target.value.toLowerCase().trim();
                                const filtered = sourceArticles.filter(item => {
                                    const title = (item.title || item.judul || '').toLowerCase();
                                    return title.includes(keyword);
                                });
                                renderList(filtered);
                            });
                        }
                    })
                    .catch(err => {
                        console.error('Error:', err);
                        container.innerHTML = '<p class="py-6 text-sm text-red-500">Gagal memuat daftar tulisan.</p>';
                    });
            }

            initArsip();

            if (window.swupInstance) {
                window.swupInstance.hooks.on('page:view', initArsip);
                window.swupInstance.hooks.on('content:replace', initArsip);
            }
        </script>
    </main>

    <!-- FOOTER KOSONG DENGAN ID -->
    <footer id="site-footer" class="max-w-2xl w-full mx-auto px-6 pt-12 pb-10 mt-16 border-t border-gray-100 flex flex-col sm:flex-row justify-between items-center gap-4 text-xs text-gray-500"></footer>

    <!-- SKRIP INISIALISASI SWUP & COMPONENT LOADER -->
    <script>
        if (typeof window.swupInstance === 'undefined') {
            window.swupInstance = new Swup({
                plugins: [
                    new SwupScriptsPlugin(),
                    new SwupHeadPlugin({
                        awaitAssets: true,
                        persistAssets: true
                    })
                ]
            });
        }

        function loadComponents() {
            const headerEl = document.getElementById('site-header');
            if (headerEl && !headerEl.innerHTML.trim()) {
                fetch('components/header.html')
                    .then(res => res.text())
                    .then(html => headerEl.innerHTML = html)
                    .catch(err => console.error(err));
            }

            const footerEl = document.getElementById('site-footer');
            if (footerEl && !footerEl.innerHTML.trim()) {
                fetch('components/footer.html')
                    .then(res => res.text())
                    .then(html => footerEl.innerHTML = html)
                    .catch(err => console.error(err));
            }
        }

        loadComponents();

        if (window.swupInstance) {
            window.swupInstance.hooks.on('page:view', loadComponents);
        }
    </script>
</body>
</html>
