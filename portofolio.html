<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Meta Tag SEO Utama -->
    <title>Portofolio & Klien - Catatan Al Ikhsan Nahdillah Muis Malik</title>
    <meta name="title" content="Portofolio & Klien - Catatan Al Ikhsan Nahdillah Muis Malik">
    <meta name="description" content="Daftar project, jaringan sekolah, perusahaan, dan klien yang pernah bekerja sama dengan Al Ikhsan Nahdillah Muis Malik.">
    <meta name="author" content="Al Ikhsan Nahdillah Muis Malik">
    <meta name="robots" content="index, follow">

    <!-- Open Graph (WhatsApp/Facebook) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Portofolio & Klien - Catatan Al Ikhsan Nahdillah Muis Malik">
    <meta property="og:description" content="Daftar project, jaringan sekolah, perusahaan, dan klien yang pernah bekerja sama dengan Al Ikhsan Nahdillah Muis Malik.">
    <meta property="og:image" content="https://ikhsannahdillah.github.io/assets/img/og-image.jpg">

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="https://ikhsannahdillah.github.io/assets/img/favicon.jpg">

    <!-- Tailwind CSS & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .transition-fade {
            transition: opacity 0.2s ease-in-out, transform 0.2s ease-in-out;
            opacity: 1;
            transform: translateY(0);
        }
        html.is-animating .transition-fade {
            opacity: 0;
            transform: translateY(4px);
        }
    </style>

    <!-- CDN Swup & Plugin Scripts -->
    <script src="https://unpkg.com/swup@4"></script>
    <script src="https://unpkg.com/@swup/scripts-plugin@2"></script>
    <script src="https://unpkg.com/@swup/head-plugin@2"></script>
</head>
<body class="bg-white text-gray-800 antialiased min-h-screen flex flex-col justify-between">

    <!-- HEADER KOSONG DENGAN ID -->
    <header id="site-header" class="max-w-2xl w-full mx-auto px-6 pt-10 pb-8 flex justify-between items-center"></header>

    <!-- KONTAINER UTAMA PORTOFOLIO (DI DALAM #SWUP) -->
    <main id="swup" class="transition-fade max-w-2xl w-full mx-auto px-6 py-4 flex-grow">
        <section>
            <!-- Judul Halaman -->
            <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-900 tracking-tight mb-4">
                Portofolio & Klien
            </h1>

            <!-- Paragraf Pengantar -->
            <p class="text-gray-600 text-sm sm:text-base leading-relaxed mb-8">
                Hingga saat ini saya telah menyelesaikan berbagai proyek yang berhubungan dengan infrastruktur jaringan komputer, konfigurasi server, serta pengembangan aplikasi web untuk instansi pemerintahan, sektor pendidikan, dan perusahaan swasta.
            </p>

            <!-- Daftar Kartu Portofolio (List Clean View) -->
            <div id="grid-portofolio" class="space-y-4">
                <div class="p-4 rounded-xl border border-gray-100 bg-gray-50 text-sm text-gray-400 font-mono animate-pulse">
                    Memuat data portofolio...
                </div>
            </div>
        </section>

        <!-- SKRIP LOGIKA PEMUATAN DATA PORTOFOLIO -->
        <script>
            function renderPortofolio() {
                const gridContainer = document.getElementById('grid-portofolio');
                if (!gridContainer) return;

                fetch('https://ikhsannahdillah.github.io/assets/js/portofolio.json')
                    .then(res => {
                        if (!res.ok) throw new Error('Gagal memuat JSON Portofolio');
                        return res.json();
                    })
                    .then(data => {
                        if (!data || data.length === 0) {
                            gridContainer.innerHTML = '<p class="py-6 text-sm text-gray-500 font-mono">Belum ada portofolio yang ditampilkan.</p>';
                            return;
                        }

                        gridContainer.innerHTML = data.map(item => `
                            <div class="flex items-start gap-4 p-4 rounded-xl border border-gray-200/70 hover:border-gray-300 hover:bg-gray-50/60 transition bg-white shadow-sm">
                                <!-- Logo Klien -->
                                <div class="w-12 h-12 flex-shrink-0 rounded-lg bg-gray-50 border border-gray-100 flex items-center justify-center p-1.5">
                                    <img src="${item.logo}" 
                                         alt="${item.nama}" 
                                         class="max-h-full max-w-full object-contain"
                                         onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' fill=\'none\' viewBox=\'0 0 24 24\' stroke=\'%239CA3AF\'><path stroke-linecap=\'round\' stroke-linejoin=\'round\' stroke-width=\'2\' d=\'M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4\'/></svg>';">
                                </div>
                                
                                <!-- Konten Portofolio -->
                                <div class="flex-grow min-w-0">
                                    <div class="flex flex-wrap items-center justify-between gap-2">
                                        <h2 class="text-base font-bold text-gray-900 leading-snug">
                                            ${item.nama}
                                        </h2>
                                        ${item.tahun ? `
                                            <span class="text-[11px] font-mono font-medium px-2 py-0.5 rounded bg-gray-100 text-gray-600">
                                                ${item.tahun}
                                            </span>
                                        ` : ''}
                                    </div>
                                    <p class="text-sm text-gray-600 font-normal mt-1 leading-relaxed">
                                        ${item.layanan}
                                    </p>
                                    ${item.url ? `
                                        <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 text-xs text-blue-600 hover:underline font-medium mt-2">
                                            <span>Kunjungi Sistem</span>
                                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                                        </a>
                                    ` : ''}
                                </div>
                            </div>
                        `).join('');
                    })
                    .catch(err => {
                        console.error('Portofolio Fetch Error:', err);
                        gridContainer.innerHTML = '<p class="py-6 text-sm text-red-500 font-mono">Gagal memuat portofolio. Pastikan file assets/js/portofolio.json tersedia.</p>';
                    });
            }

            renderPortofolio();
        </script>
    </main>

    <!-- FOOTER KOSONG DENGAN ID -->
    <footer id="site-footer" class="max-w-2xl w-full mx-auto px-6 pt-12 pb-10 mt-16 border-t border-gray-100 flex flex-col sm:flex-row justify-between items-center gap-4 text-xs text-gray-500"></footer>

    <!-- SKRIP INISIALISASI SWUP & COMPONENT LOADER -->
    <script>
        function loadComponents() {
            const headerEl = document.getElementById('site-header');
            if (headerEl && !headerEl.innerHTML.trim()) {
                fetch('https://ikhsannahdillah.github.io/components/header.html')
                    .then(res => res.text())
                    .then(html => headerEl.innerHTML = html)
                    .catch(err => console.error('Header Load Error:', err));
            }

            const footerEl = document.getElementById('site-footer');
            if (footerEl && !footerEl.innerHTML.trim()) {
                fetch('https://ikhsannahdillah.github.io/components/footer.html')
                    .then(res => res.text())
                    .then(html => footerEl.innerHTML = html)
                    .catch(err => console.error('Footer Load Error:', err));
            }
        }

        document.addEventListener('DOMContentLoaded', loadComponents);

        if (typeof window.swupInstance === 'undefined') {
            window.swupInstance = new Swup({
                plugins: [
                    new SwupScriptsPlugin(),
                    new SwupHeadPlugin({
                        awaitAssets: true,
                        persistAssets: true
                    })
                ],
                resolveUrl: (url) => url
            });

            window.swupInstance.hooks.on('page:view', () => {
                loadComponents();
                if (typeof renderPortofolio === 'function') {
                    renderPortofolio();
                }
            });
        }
    </script>
</body>
</html>
