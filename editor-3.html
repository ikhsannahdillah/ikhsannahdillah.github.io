<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Article Editor</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- TinyMCE CDN (Community Edition Free) -->
    <script src="https://cdn.jsdelivr.net/npm/tinymce@7/tinymce.min.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        .tox-tinymce {
            border-radius: 0.75rem !important;
            border-color: #e2e8f0 !important;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 antialiased min-h-screen py-10 px-4">

    <div class="max-w-5xl mx-auto bg-white rounded-2xl shadow-sm border border-gray-200 p-6 sm:p-8">
        
        <!-- Header Editor -->
        <div class="border-b border-gray-100 pb-5 mb-6 flex flex-wrap gap-3 justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">Visual Article Editor</h1>
                <p class="text-sm text-gray-500 mt-1">Editor Pro dengan TinyMCE: Tabel, Code Snippet, Quotes & HTML Export</p>
            </div>
            <div class="flex items-center gap-2">
                <button id="btn-export-html" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2.5 rounded-xl text-sm transition flex items-center gap-2 shadow-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    Download HTML Statis
                </button>
                <button id="btn-show-json" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2.5 rounded-xl text-sm transition flex items-center gap-2 shadow-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
                    Kode JSON
                </button>
            </div>
        </div>

        <!-- Meta Form -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
            <div class="sm:col-span-2">
                <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-2">Judul Artikel</label>
                <input type="text" id="article-title" placeholder="Masukkan judul artikel..." class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-base font-medium">
            </div>

            <div class="sm:col-span-2">
                <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-2">Header Image (Featured Image)</label>
                <div class="flex gap-2">
                    <input type="text" id="article-cover" value="/assets/img/og-image.jpg" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="file" id="cover-file-input" accept="image/*" class="hidden">
                    <button type="button" id="btn-browse-cover" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 border border-gray-300 rounded-xl text-xs font-semibold text-gray-700 whitespace-nowrap transition">
                        Pilih Header
                    </button>
                </div>
            </div>

            <div class="sm:col-span-2">
                <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-2">Tags / Kategori (Pisahkan dengan koma)</label>
                <input type="text" id="article-tags" placeholder="Contoh: Social Engineering, Security, Cyber" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-2">Tanggal Rilis</label>
                <input type="date" id="article-date" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-2">Slug URL (Otomatis)</label>
                <input type="text" id="article-slug" placeholder="judul-artikel" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl bg-gray-50 text-gray-600 text-sm outline-none" readonly>
            </div>

            <div class="sm:col-span-2">
                <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-2">Ringkasan / Excerpt</label>
                <textarea id="article-excerpt" rows="2" placeholder="Ringkasan singkat..." class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            </div>
        </div>

        <!-- Area Editor TinyMCE -->
        <div class="mb-6">
            <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-2">Isi Konten Artikel</label>
            <textarea id="editor"></textarea>
        </div>

    </div>

    <!-- MODAL POPUP JSON -->
    <div id="json-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl max-w-3xl w-full p-6 shadow-2xl border border-gray-100 flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center pb-4 border-b border-gray-100">
                <h3 class="text-lg font-bold text-gray-900">Hasil Kode JSON Artikel</h3>
                <button id="btn-close-modal" class="text-gray-400 hover:text-gray-600 font-bold text-xl">&times;</button>
            </div>
            
            <div class="my-4 flex-grow overflow-hidden">
                <textarea id="json-output" class="w-full h-80 p-4 font-mono text-xs bg-gray-900 text-green-400 rounded-xl outline-none resize-none border border-gray-800" readonly></textarea>
            </div>

            <div class="flex justify-end gap-3 pt-2">
                <button id="btn-copy-json" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2.5 rounded-xl text-sm transition flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 012-2H8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
                    Salin JSON
                </button>
            </div>
        </div>
    </div>

    <script>
        const TARGET_IMG_PATH = '/assets/img/artikel/';

        // Inisialisasi TinyMCE
        tinymce.init({
            selector: '#editor',
            height: 500,
            menubar: 'file edit view insert format table tools',
            plugins: [
                'advlist', 'autolink', 'lists', 'link', 'image', 'charmap', 'preview',
                'anchor', 'searchreplace', 'visualblocks', 'code', 'fullscreen',
                'insertdatetime', 'media', 'table', 'code', 'help', 'wordcount', 'codesample', 'blockquote'
            ],
            toolbar: 'undo redo | blocks fontfamily fontsize | bold italic underline strikethrough forecolor backcolor | alignleft aligncenter alignright alignjustify | bullist numlist outdent indent | table blockquote codesample link image media | removeformat code fullscreen',
            content_style: `
                body { font-family: 'Inter', sans-serif; font-size: 16px; color: #1e293b; line-height: 1.6; }
                table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
                td, th { border: 1px solid #cbd5e1; padding: 10px 14px; }
                th { background-color: #f8fafc; font-weight: 600; }
                blockquote { border-left: 4px solid #2563eb; padding-left: 1rem; margin: 1rem 0; color: #475569; font-style: italic; background-color: #f8fafc; padding-top: 0.5rem; padding-bottom: 0.5rem; }
                pre { background-color: #0f172a; color: #38bdf8; padding: 1rem; border-radius: 0.5rem; font-family: monospace; }
                img { max-width: 100%; height: auto; border-radius: 0.5rem; }
            `,
            image_title: true,
            automatic_uploads: true,
            file_picker_types: 'image',
            file_picker_callback: (cb, value, meta) => {
                const input = document.createElement('input');
                input.setAttribute('type', 'file');
                input.setAttribute('accept', 'image/*');

                input.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const fullPath = TARGET_IMG_PATH + file.name;
                        cb(fullPath, { title: file.name });
                    }
                });

                input.click();
            },
            setup: (editor) => {
                editor.on('change keyup', () => {
                    const contentText = editor.getContent({ format: 'text' }).trim();
                    const excerptInput = document.getElementById('article-excerpt');
                    if (contentText.length > 0) {
                        excerptInput.value = contentText.substring(0, 150) + (contentText.length > 150 ? '...' : '');
                    }
                });
            }
        });

        // Cover Image Upload Handler
        const btnBrowseCover = document.getElementById('btn-browse-cover');
        const coverFileInput = document.getElementById('cover-file-input');
        const coverInput = document.getElementById('article-cover');

        btnBrowseCover.addEventListener('click', () => coverFileInput.click());
        coverFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                coverInput.value = TARGET_IMG_PATH + file.name;
                coverFileInput.value = '';
            }
        });

        // Slug & Date Auto Setup
        document.getElementById('article-date').valueAsDate = new Date();
        const titleInput = document.getElementById('article-title');
        const slugInput = document.getElementById('article-slug');
        const excerptInput = document.getElementById('article-excerpt');
        const tagsInput = document.getElementById('article-tags');

        titleInput.addEventListener('input', () => {
            slugInput.value = titleInput.value.toLowerCase().replace(/[^a-z0-9 -]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-');
        });

        // JSON Generation
        const modal = document.getElementById('json-modal');
        const jsonOutput = document.getElementById('json-output');
        const btnShowJson = document.getElementById('btn-show-json');
        const btnCloseModal = document.getElementById('btn-close-modal');
        const btnCopyJson = document.getElementById('btn-copy-json');

        btnShowJson.addEventListener('click', () => {
            const title = titleInput.value.trim();
            if (!title) return alert('Silakan masukkan judul artikel terlebih dahulu!');

            const rawTags = tagsInput.value.split(',').map(t => t.trim()).filter(t => t.length > 0);
            const rawSlug = slugInput.value;
            const fullHtmlPath = `/articles/${rawSlug}.html`;

            let coverPath = coverInput.value.trim() || '/assets/img/og-image.jpg';
            if (!coverPath.startsWith('/') && !coverPath.startsWith('http')) {
                coverPath = '/' + coverPath;
            }

            const articleData = {
                title: title,
                slug: fullHtmlPath,
                url: fullHtmlPath,
                date: document.getElementById('article-date').value,
                tags: rawTags,
                cover: coverPath,
                excerpt: excerptInput.value
            };

            jsonOutput.value = JSON.stringify(articleData, null, 2);
            modal.classList.remove('hidden');
        });

        btnCloseModal.addEventListener('click', () => modal.classList.add('hidden'));

        btnCopyJson.addEventListener('click', () => {
            jsonOutput.select();
            navigator.clipboard.writeText(jsonOutput.value).then(() => {
                const originalText = btnCopyJson.innerHTML;
                btnCopyJson.innerHTML = `✓ Tersalin!`;
                btnCopyJson.classList.replace('bg-blue-600', 'bg-green-600');
                
                setTimeout(() => {
                    btnCopyJson.innerHTML = originalText;
                    btnCopyJson.classList.replace('bg-green-600', 'bg-blue-600');
                }, 2000);
            });
        });

        function formatTanggalIndo(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            if (isNaN(date.getTime())) return dateStr;
            return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
        }

        // Export Static HTML
        const btnExportHtml = document.getElementById('btn-export-html');

        btnExportHtml.addEventListener('click', () => {
            const title = titleInput.value.trim();
            if (!title) return alert('Silakan masukkan judul artikel terlebih dahulu!');

            const slug = slugInput.value;
            const rawDate = document.getElementById('article-date').value;
            const formattedDate = formatTanggalIndo(rawDate);
            const excerpt = excerptInput.value.trim() || title;
            
            let coverPath = coverInput.value.trim() || '/assets/img/og-image.jpg';
            if (!coverPath.startsWith('/') && !coverPath.startsWith('http')) {
                coverPath = '/' + coverPath;
            }

            const rawTags = tagsInput.value.split(',').map(t => t.trim()).filter(t => t.length > 0);
            const tagsHtml = rawTags.map(tag => 
                `<a href="/tags.html?tag=${encodeURIComponent(tag)}" class="inline-block bg-gray-100 hover:bg-gray-200 text-gray-600 hover:text-gray-900 text-xs font-medium px-3 py-1 rounded-md transition">${tag}</a>`
            ).join('\n\t\t\t\t');

            const fullTitle = `${title} - Catatan Al Ikhsan Nahdillah Muis Malik`;
            const articleUrl = `https://ikhsannahdillah.github.io/articles/${slug}.html`;
            const fullOgImage = coverPath.startsWith('http') ? coverPath : `https://ikhsannahdillah.github.io${coverPath}`;
            const cleanedContent = tinymce.get('editor').getContent();

            const schemaData = {
                "@context": "https://schema.org",
                "@type": "BlogPosting",
                "mainEntityOfPage": { "@type": "WebPage", "@id": articleUrl },
                "headline": title,
                "description": excerpt,
                "image": fullOgImage,  
                "author": { "@type": "Person", "name": "Al Ikhsan Nahdillah Muis Malik", "url": "https://ikhsannahdillah.github.io/about.html" },
                "publisher": { "@type": "Person", "name": "Al Ikhsan Nahdillah Muis Malik" },
                "datePublished": rawDate,
                "dateModified": rawDate
            };

            const fullStaticHtml = `<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	
	<!-- Primary Meta Tags -->
	<title id="meta-title">${fullTitle}</title>
	<meta name="title" id="meta-title-tag" content="${fullTitle}">
	<meta name="description" id="meta-desc" content="${excerpt}">
	<meta name="keywords" id="meta-keywords" content="${rawTags.join(', ')}">
	<meta name="author" content="Al Ikhsan Nahdillah Muis Malik">
	<meta name="robots" content="index, follow, max-image-preview:large">

	<!-- Open Graph / Facebook / WhatsApp -->
	<meta property="og:type" content="article">
	<meta property="og:url" id="og-url" content="${articleUrl}">
	<meta property="og:title" id="og-title" content="${fullTitle}">
	<meta property="og:description" id="og-desc" content="${excerpt}">
	<meta property="og:image" id="og-image" content="${fullOgImage}">
	<meta property="article:published_time" id="og-time" content="${rawDate}">
	<meta property="article:author" content="Al Ikhsan Nahdillah Muis Malik">

	<!-- Twitter -->
	<meta property="twitter:card" content="summary_large_image">
	<meta property="twitter:url" id="twitter-url" content="${articleUrl}">
	<meta property="twitter:title" id="twitter-title" content="${fullTitle}">
	<meta property="twitter:description" id="twitter-desc" content="${excerpt}">
	<meta property="twitter:image" id="twitter-image" content="${fullOgImage}">

	<!-- Canonical URL -->
	<link rel="canonical" id="canonical-url" href="${articleUrl}">

	<!-- Schema.org JSON-LD -->
	<script type="application/ld+json" id="schema-json">
${JSON.stringify(schemaData, null, 2)}
	<\/script>

	<script src="https://cdn.tailwindcss.com"><\/script>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
	
	<!-- PrismJS untuk Syntax Highlighting Code Snippet -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">

	<style>
		body { font-family: 'Inter', sans-serif; }
		.transition-fade { transition: opacity 0.2s ease-in-out, transform 0.2s ease-in-out; opacity: 1; transform: translateY(0); }
		html.is-animating .transition-fade { opacity: 0; transform: translateY(4px); }

		/* Style hasil export konten HTML */
		#article-content p { margin-bottom: 1.25rem; line-height: 1.75; }
		#article-content ul { list-style-type: disc; padding-left: 1.5rem; margin: 1rem 0; }
		#article-content ol { list-style-type: decimal; padding-left: 1.5rem; margin: 1rem 0; }
		#article-content table { border-collapse: collapse; width: 100%; margin: 1.5rem 0; }
		#article-content td, #article-content th { border: 1px solid #cbd5e1; padding: 10px 14px; }
		#article-content th { background-color: #f8fafc; font-weight: 600; text-align: left; }
		#article-content blockquote { border-left: 4px solid #2563eb; padding-left: 1rem; color: #475569; font-style: italic; margin: 1.5rem 0; background-color: #f8fafc; padding-top: 0.5rem; padding-bottom: 0.5rem; border-radius: 0 0.375rem 0.375rem 0; }
		#article-content pre { border-radius: 0.5rem; margin: 1.5rem 0; }
		#article-content img { max-width: 100%; height: auto; border-radius: 0.75rem; margin: 1.5rem auto; display: block; }
	</style>

	<!-- Swup & Plugins -->
	<script src="https://unpkg.com/swup@4"><\/script>
	<script src="https://unpkg.com/@swup/scripts-plugin@2"><\/script>
	<script src="https://unpkg.com/@swup/head-plugin@2"><\/script>
	
	<link rel="icon" type="image/jpg" href="/assets/img/favicon.jpg">
</head>
<body class="bg-white text-gray-800 antialiased min-h-screen flex flex-col justify-between">

	<!-- HEADER (PERMANEN) -->
	<header id="site-header" class="max-w-2xl w-full mx-auto px-6 pt-10 pb-8 flex justify-between items-center"></header>

	<!-- KONTAINER UTAMA ARTIKEL (DI DALAM #SWUP) -->
	<main id="swup" class="transition-fade max-w-2xl w-full mx-auto px-6 py-4 flex-grow">
		<article>
			
			<!-- BREADCRUMB -->
			<nav class="flex text-xs text-gray-500 mb-6" aria-label="Breadcrumb">
				<ol class="inline-flex items-center space-x-1 md:space-x-2 flex-wrap">
					<li class="inline-flex items-center">
						<a href="/index.html" class="hover:text-blue-600 transition-colors">Beranda</a>
					</li>
					<li>
						<div class="flex items-center">
							<svg class="w-3 h-3 text-gray-400 mx-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
							<a href="/articles.html" class="hover:text-blue-600 transition-colors">Tulisan</a>
						</div>
					</li>
					<li aria-current="page">
						<div class="flex items-center">
							<svg class="w-3 h-3 text-gray-400 mx-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
							<span id="breadcrumb-title" class="text-gray-400 font-medium truncate max-w-[180px] sm:max-w-xs">${title}</span>
						</div>
					</li>
				</ol>
			</nav>

			<!-- 1. JUDUL UTAMA ARTIKEL -->
			<h1 id="article-title" class="text-3xl sm:text-4xl font-extrabold text-gray-900 tracking-tight leading-tight sm:leading-snug mb-3">
				${title}
			</h1>

			<!-- 2. METADATA -->
			<div class="text-xs text-gray-500 font-medium mb-3">
				Al Ikhsan Nahdillah Muis Malik / <span id="article-date">${formattedDate}</span>
			</div>

			<!-- 3. BADGE TAGS -->
			<div id="tags-container" class="mb-4 flex flex-wrap gap-2 ${rawTags.length ? '' : 'hidden'}">
				${tagsHtml}
			</div>

			<!-- TOMBOL SHARE ATAS -->
			<div class="flex items-center gap-2 mb-8 py-3 border-y border-gray-100">
				<span class="text-xs font-semibold text-gray-500 mr-1">Bagikan:</span>
				<a id="share-top-wa" href="https://api.whatsapp.com/send?text=${encodeURIComponent(title)}%20${encodeURIComponent(articleUrl)}" target="_blank" rel="noopener noreferrer" title="Bagikan ke WhatsApp" class="p-1.5 rounded-lg text-gray-500 hover:text-green-600 hover:bg-green-50 transition">
					<svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
				</a>
				<a id="share-top-twitter" href="https://twitter.com/intent/tweet?text=${encodeURIComponent(title)}&url=${encodeURIComponent(articleUrl)}" target="_blank" rel="noopener noreferrer" title="Bagikan ke X (Twitter)" class="p-1.5 rounded-lg text-gray-500 hover:text-gray-900 hover:bg-gray-100 transition">
					<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>

	<!-- SCRIPT MEMUAT COMPONENT HEADER & FOOTER -->
	<script>
		function loadComponents() {
			const isSubfolder = window.location.pathname.includes('/articles/');
			const basePath = isSubfolder ? '../' : './';

			const headerEl = document.getElementById('site-header');
			if (headerEl && !headerEl.innerHTML.trim()) {
				fetch(basePath + 'components/header.html')
					.then(res => res.text())
					.then(html => {
						headerEl.innerHTML = html;
						if (isSubfolder) {
							headerEl.querySelectorAll('a[href]').forEach(a => {
								const href = a.getAttribute('href');
								if (href && !href.startsWith('http') && !href.startsWith('#') && !href.startsWith('/')) {
									a.setAttribute('href', '../' + href);
								}
							});
							headerEl.querySelectorAll('img[src]').forEach(img => {
								const src = img.getAttribute('src');
								if (src && !src.startsWith('http') && !src.startsWith('data:') && !src.startsWith('/')) {
									img.setAttribute('src', '../' + src);
								}
							});
						}
					})
					.catch(err => console.error('Gagal memuat header:', err));
			}

			const footerEl = document.getElementById('site-footer');
			if (footerEl && !footerEl.innerHTML.trim()) {
				fetch(basePath + 'components/footer.html')
					.then(res => res.text())
					.then(html => {

						}
					})
					.catch(err => console.error('Gagal memuat footer:', err));
