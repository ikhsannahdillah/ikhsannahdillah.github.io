<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Meta Tag SEO Utama (Otomatis ditangani SwupHeadPlugin) -->
    <title>Speaking - Catatan Al Ikhsan Nahdillah Muis Malik</title>
    <meta name="title" content="Speaking - Catatan Al Ikhsan Nahdillah Muis Malik">
    <meta name="description" content="Informasi mengenai acara, workshop, dan seminar yang pernah menghadirkan Al Ikhsan Nahdillah Muis Malik sebagai pembicara.">
    <meta name="author" content="Al Ikhsan Nahdillah Muis Malik">

    <!-- Open Graph (WhatsApp & Facebook Share) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Speaking - Catatan Al Ikhsan Nahdillah Muis Malik">
    <meta property="og:description" content="Daftar seminar, workshop, dan acara teknologi yang pernah menghadirkan Al Ikhsan Nahdillah Muis Malik.">
    <meta property="og:image" content="assets/img/og-image.jpg">

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="assets/img/favicon.jpg">

    <!-- Tailwind CSS & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'Fira Code', monospace; }
        .transition-fade {
            transition: opacity 0.2s ease-in-out, transform 0.2s ease-in-out;
            opacity: 1;
            transform: translateY(0);
        }
        html.is-animating .transition-fade {
            opacity: 0;
            transform: translateY(4px);
        }
    </style>

    <!-- CDN Swup & Plugins Scripts -->
    <script src="https://unpkg.com/swup@4"></script>
    <script src="https://unpkg.com/@swup/scripts-plugin@2"></script>
    <script src="https://unpkg.com/@swup/head-plugin@2"></script>
</head>
<body class="bg-white text-gray-800 antialiased min-h-screen flex flex-col justify-between">

    <!-- HEADER KOSONG DENGAN ID -->
    <header id="site-header" class="max-w-2xl w-full mx-auto px-6 pt-10 pb-8 flex justify-between items-center"></header>

    <!-- KONTAINER UTAMA SPEAKING (DI DALAM #SWUP) -->
    <main id="swup" class="transition-fade max-w-2xl w-full mx-auto px-6 py-4 flex-grow">
        <section>
            <!-- Judul Halaman -->
            <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-900 tracking-tight leading-tight mb-4">
                Speaking
            </h1>

            <!-- Paragraf Deskripsi (Sudah Diperbaiki Tata Bahasanya) -->
            <p class="text-gray-600 leading-relaxed text-base mb-8">
                Selain beraktivitas secara profesional, saya secara berkala mengisi waktu untuk menjadi pembicara atau pemateri ketika diundang oleh lembaga, instansi, maupun komunitas. Daftar acara yang pernah menghadirkan saya tercatat di halaman ini.
            </p>

            <!-- Daftar Kartu Event / Speaking -->
            <div id="daftar-speaking" class="space-y-6">
                <div class="p-4 rounded-lg bg-gray-50 border border-gray-100 text-sm text-gray-400 animate-pulse font-mono">
                    Memuat data acara...
                </div>
            </div>
        </section>

        <!-- SKRIP RENDER DATA SPEAKING (Ringkas & Aman Swup) -->
        <script>
            (function renderSpeaking() {
                const container = document.getElementById('daftar-speaking');
                if (!container) return;

                fetch('assets/js/speaking.json')
                    .then(res => {
                        if (!res.ok) throw new Error('Gagal memuat file JSON');
                        return res.json();
                    })
                    .then(data => {
                        if (!data || data.length === 0) {
                            container.innerHTML = '<p class="text-sm text-gray-500 font-mono">Belum ada data acara yang terdaftar.</p>';
                            return;
                        }

                        container.innerHTML = data.map(event => `
                            <div class="bg-white border border-gray-200/80 rounded-xl overflow-hidden shadow-sm hover:shadow-md transition">
                                <!-- Window Bar Top Style -->
                                <div class="bg-gray-100/80 px-4 py-2 flex items-center justify-between border-b border-gray-200/60">
                                    <div class="flex items-center gap-1.5">
                                        <span class="w-2.5 h-2.5 rounded-full bg-red-400 inline-block"></span>
                                        <span class="w-2.5 h-2.5 rounded-full bg-yellow-400 inline-block"></span>
                                        <span class="w-2.5 h-2.5 rounded-full bg-green-400 inline-block"></span>
                                    </div>
                                    ${event.year ? `<span class="text-[11px] font-mono text-gray-400">${event.year}</span>` : ''}
                                </div>
                                
                                <!-- Terminal / Code Style Content -->
                                <div class="p-5 font-mono text-sm space-y-3">
                                    <h2 class="text-gray-900 font-semibold text-base leading-snug">
                                        ${event.title || 'Untitled Event'}
                                    </h2>
                                    
                                    <div class="text-xs text-gray-500 space-y-1">
                                        ${event.organizer ? `<p class="flex items-center gap-2"><span class="text-gray-400">Penyelenggara:</span> ${event.organizer}</p>` : ''}
                                        ${event.location ? `<p class="flex items-center gap-2"><span class="text-gray-400">Lokasi:</span> ${event.location}</p>` : ''}
                                    </div>

                                    ${event.link ? `
                                        <div class="pt-2">
                                            <a href="${event.link}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 text-xs text-blue-600 hover:underline">
                                                Lihat Dokumentasi / Slide &rarr;
                                            </a>
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                        `).join('');
                    })
                    .catch(err => {
                        console.error('Speaking Fetch Error:', err);
                        container.innerHTML = '<p class="text-sm text-red-500 font-mono">Gagal memuat data acara. Pastikan file assets/js/speaking.json tersedia.</p>';
                    });
            })();
        </script>
    </main>

    <!-- FOOTER KOSONG DENGAN ID -->
    <footer id="site-footer" class="max-w-2xl w-full mx-auto px-6 pt-12 pb-10 mt-16 border-t border-gray-100 flex flex-col sm:flex-row justify-between items-center gap-4 text-xs text-gray-500"></footer>

    <!-- SKRIP INISIALISASI SWUP & COMPONENT LOADER -->
    <script>
        function loadComponents() {
            const headerEl = document.getElementById('site-header');
            if (headerEl && !headerEl.innerHTML.trim()) {
                fetch('components/header.html')
                    .then(res => res.text())
                    .then(html => headerEl.innerHTML = html)
                    .catch(err => console.error('Header Load Error:', err));
            }

            const footerEl = document.getElementById('site-footer');
            if (footerEl && !footerEl.innerHTML.trim()) {
                fetch('components/footer.html')
                    .then(res => res.text())
                    .then(html => footerEl.innerHTML = html)
                    .catch(err => console.error('Footer Load Error:', err));
            }
        }

        document.addEventListener('DOMContentLoaded', loadComponents);

        if (typeof window.swupInstance === 'undefined') {
            window.swupInstance = new Swup({
                plugins: [
                    new SwupScriptsPlugin(),
                    new SwupHeadPlugin({
                        awaitAssets: true,
                        persistAssets: true
                    })
                ],
                resolveUrl: (url) => url
            });

            window.swupInstance.hooks.on('page:view', loadComponents);
        }
    </script>
</body>
</html>
