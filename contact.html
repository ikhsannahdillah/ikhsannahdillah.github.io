<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Meta Tag SEO Utama -->
    <title>Contact - Catatan Al Ikhsan Nahdillah Muis Malik</title>
    <meta name="title" content="Contact - Catatan Al Ikhsan Nahdillah Muis Malik">
    <meta name="description" content="Informasi kontak, tautan sosial media, dan PGP Public Key untuk menghubungi Al Ikhsan Nahdillah Muis Malik.">
    <meta name="author" content="Al Ikhsan Nahdillah Muis Malik">

    <!-- Open Graph (WhatsApp & Facebook Share) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Contact - Catatan Al Ikhsan Nahdillah Muis Malik">
    <meta property="og:description" content="Informasi kontak dan PGP Public Key untuk menghubungi Al Ikhsan Nahdillah Muis Malik.">
    <meta property="og:image" content="https://ikhsannahdillah.github.io/assets/img/og-image.jpg">

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="https://ikhsannahdillah.github.io/assets/img/favicon.jpg">

    <!-- Tailwind CSS & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'Fira Code', monospace; }
        .transition-fade {
            transition: opacity 0.2s ease-in-out, transform 0.2s ease-in-out;
            opacity: 1;
            transform: translateY(0);
        }
        html.is-animating .transition-fade {
            opacity: 0;
            transform: translateY(4px);
        }
    </style>

    <!-- CDN Swup & Plugins Scripts -->
    <script src="https://unpkg.com/swup@4"></script>
    <script src="https://unpkg.com/@swup/scripts-plugin@2"></script>
    <script src="https://unpkg.com/@swup/head-plugin@2"></script>
</head>
<body class="bg-white text-gray-800 antialiased min-h-screen flex flex-col justify-between">

    <!-- HEADER KOSONG DENGAN ID -->
    <header id="site-header" class="max-w-2xl w-full mx-auto px-6 pt-10 pb-8 flex justify-between items-center"></header>

    <!-- KONTAINER UTAMA CONTACT (DI DALAM #SWUP) -->
    <main id="swup" class="transition-fade max-w-2xl w-full mx-auto px-6 py-4 flex-grow">
        <section class="space-y-8">
            <!-- Judul Halaman -->
            <div>
                <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-900 tracking-tight leading-tight">
                    Contact
                </h1>
                <p class="text-gray-600 leading-relaxed text-base mt-3">
                    Untuk kebutuhan pekerjaan, konsultasi infrastruktur IT, maupun kerja sama, Anda dapat menghubungi saya melalui saluran berikut:
                </p>
            </div>

            <!-- Daftar Kartu Kontak Cepat -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Kartu Email -->
                <div class="p-5 rounded-xl border border-gray-200/80 bg-white shadow-sm flex flex-col justify-between space-y-4">
                    <div>
                        <span class="text-xs font-mono uppercase tracking-wider text-gray-400 block mb-1">Email Direct</span>
                        <a href="mailto:ikhsannahdillah@gmail.com" class="text-gray-900 font-medium hover:text-blue-600 transition break-all">
                            ikhsannahdillah@gmail.com
                        </a>
                    </div>
                    <div class="pt-2 border-t border-gray-100 flex items-center justify-between text-xs">
                        <span class="text-gray-500">Kirim pesan langsung</span>
                        <button onclick="copyToClipboard('ikhsannahdillah@gmail.com', this)" class="text-blue-600 hover:underline font-mono">
                            Copy Email
                        </button>
                    </div>
                </div>

                <!-- Kartu LinkedIn -->
                <div class="p-5 rounded-xl border border-gray-200/80 bg-white shadow-sm flex flex-col justify-between space-y-4">
                    <div>
                        <span class="text-xs font-mono uppercase tracking-wider text-gray-400 block mb-1">Professional Profile</span>
                        <a href="https://www.linkedin.com/in/ikhsannahdillah/" target="_blank" rel="noopener noreferrer" class="text-gray-900 font-medium hover:text-blue-600 transition">
                            linkedin.com/in/ikhsannahdillah
                        </a>
                    </div>
                    <div class="pt-2 border-t border-gray-100 flex items-center justify-between text-xs">
                        <span class="text-gray-500">Direct Message</span>
                        <a href="https://www.linkedin.com/in/ikhsannahdillah/" target="_blank" rel="noopener noreferrer" class="text-blue-600 hover:underline font-mono inline-flex items-center gap-1">
                            <span>Buka LinkedIn</span> &rarr;
                        </a>
                    </div>
                </div>
            </div>
        </section>

        <!-- Skrip Pembantu Copy Email -->
        <script>
            function copyToClipboard(text, btnEl) {
                navigator.clipboard.writeText(text).then(() => {
                    const originalText = btnEl.innerText;
                    btnEl.innerText = 'Copied!';
                    btnEl.classList.add('text-green-600');
                    setTimeout(() => {
                        btnEl.innerText = originalText;
                        btnEl.classList.remove('text-green-600');
                    }, 2000);
                }).catch(err => console.error('Copy failed', err));
            }
        </script>
    </main>

    <!-- FOOTER KOSONG DENGAN ID -->
    <footer id="site-footer" class="max-w-2xl w-full mx-auto px-6 pt-12 pb-10 mt-16 border-t border-gray-100 flex flex-col sm:flex-row justify-between items-center gap-4 text-xs text-gray-500"></footer>

    <!-- SKRIP INISIALISASI SWUP & COMPONENT LOADER -->
    <script>
        function loadComponents() {
            const headerEl = document.getElementById('site-header');
            if (headerEl && !headerEl.innerHTML.trim()) {
                fetch('https://ikhsannahdillah.github.io/components/header.html')
                    .then(res => res.text())
                    .then(html => headerEl.innerHTML = html)
                    .catch(err => console.error('Header Load Error:', err));
            }

            const footerEl = document.getElementById('site-footer');
            if (footerEl && !footerEl.innerHTML.trim()) {
                fetch('https://ikhsannahdillah.github.io/components/footer.html')
                    .then(res => res.text())
                    .then(html => footerEl.innerHTML = html)
                    .catch(err => console.error('Footer Load Error:', err));
            }
        }

        document.addEventListener('DOMContentLoaded', loadComponents);

        if (typeof window.swupInstance === 'undefined') {
            window.swupInstance = new Swup({
                plugins: [
                    new SwupScriptsPlugin(),
                    new SwupHeadPlugin({
                        awaitAssets: true,
                        persistAssets: true
                    })
                ],
                resolveUrl: (url) => url
            });

            window.swupInstance.hooks.on('page:view', loadComponents);
        }
    </script>
</body>
</html>
